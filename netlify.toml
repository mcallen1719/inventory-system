[build]
  # Vite builds to `dist/`
  publish = "dist"
  # Netlify will run this to build
  command = "npm run build"

[[redirects]]
  # SPA routing: send everything to index.html
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# Cache and serve JS modules with correct MIME type (critical for Safari iOS)
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html — never cache so updates deploy instantly
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Content-Type-Options = "nosniff"
